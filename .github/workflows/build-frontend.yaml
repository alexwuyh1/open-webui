name: Build Frontend

on:
  push:
    branches:
      - custom
    paths-ignore:
      - 'docker/**'
      - '.github/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.dockerignore'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --force

      - name: Format Frontend
        run: npm run format

      - name: Run i18next
        run: npm run i18n:parse

      - name: Build Frontend
        run: npm run build
